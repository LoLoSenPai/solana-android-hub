name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hub_validation_qa
          POSTGRES_PASSWORD: hub_qa_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hub_validation_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_TEST_URL: postgresql://postgres:hub_qa_local@127.0.0.1:5432/hub_validation_qa
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare disposable database for validation lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d hub_validation_qa -v ON_ERROR_STOP=1 <<'SQL'
          create role anon;
          create role authenticated;
          create role service_role;
          SQL
          for migration in supabase/migrations/*.sql; do
            docker exec -i "${{ job.services.postgres.id }}" psql -U postgres -d hub_validation_qa -v ON_ERROR_STOP=1 < "$migration"
          done
      - run: pnpm check

  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile
      - name: Generate the single standalone Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install
      - name: Test APK identity and installed-edition policies
        working-directory: apps/mobile/android
        run: ./gradlew :hub-app-installer:testDebugUnitTest
      - name: Build standalone debug APK
        working-directory: apps/mobile/android
        # CI validates the emulator ABI. Release builds remain multi-architecture.
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64
      - name: Assert least-privileged package visibility
        shell: bash
        run: |
          set -euo pipefail
          apk="apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump xmltree "$apk" --file AndroidManifest.xml > manifest.txt
          ! grep -q 'android.permission.QUERY_ALL_PACKAGES' manifest.txt
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' manifest.txt
          grep -q 'com.lololabs.hubfixture' manifest.txt
          test "$(grep -c 'E: package (' manifest.txt)" -eq 1
      - name: Assert self-update native API is packaged
        shell: bash
        run: |
          set -euo pipefail
          apk="apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          rm -rf apk-dex
          unzip -q "$apk" 'classes*.dex' -d apk-dex
          grep -aR -q 'getCurrentAppInfo' apk-dex
