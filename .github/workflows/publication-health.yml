name: Dapport publication health

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check production publication health
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const token = await core.getIDToken('dapport-publication-health');
            core.setSecret(token);
            const response = await fetch('https://dapport.app/api/v1/internal/cron/publication-health', {
              headers: { authorization: `Bearer ${token}` },
              redirect: 'error',
              signal: AbortSignal.timeout(15_000)
            });
            const body = await response.json().catch(() => null);
            const uuid = (value) => typeof value === 'string' && /^[0-9a-f-]{36}$/.test(value);
            const code = (value) => typeof value === 'string' && /^[A-Z0-9_]{1,96}$/.test(value);
            const request = uuid(body?.requestId) ? ` (request ${body.requestId})` : '';
            if (response.status === 200 && Array.isArray(body?.issues) && body.issues.length === 0 && body.truncated === false) {
              core.info(`No current publication blockers${request}.`);
              return;
            }
            if (response.status === 503 && Array.isArray(body?.issues) && body.issues.length) {
              const counts = new Map();
              for (const issue of body.issues.slice(0, 25)) {
                if (code(issue?.code)) counts.set(issue.code, (counts.get(issue.code) ?? 0) + 1);
              }
              for (const [reason, count] of counts) core.error(`${reason}: ${count}`);
              core.setFailed(`Dapport publication blocked${request}${body.truncated === true ? ' (list truncated)' : ''}. Open https://dapport.app/admin for details.`);
              return;
            }
            const reason = code(body?.error?.code) ? ` ${body.error.code}` : '';
            core.setFailed(`Dapport publication health check failed. HTTP ${response.status}${reason}${request}. See docs/operations/incident-runbook.md.`);
