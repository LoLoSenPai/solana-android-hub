name: Ephemeral APK validator
run-name: APK validation ${{ inputs.correlation_id }}

on:
  workflow_dispatch:
    inputs:
      correlation_id:
        description: Immutable release validation correlation ID
        required: true
        type: string
      hub_origin:
        description: Canonical staging or production Hub origin
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: apk-validator-${{ inputs.correlation_id }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Acquire initial GitHub OIDC identity
        id: identity
        if: always()
        timeout-minutes: 1
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('solana-android-hub-apk-validator');
            core.setSecret(token);
            core.setOutput('token', token);
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.1
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android inspection tools
        shell: bash
        run: sdkmanager "build-tools;36.0.0"
      - name: Resolve Android inspection tools
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt2"
          echo "APKSIGNER=$build_tools/apksigner" >> "$GITHUB_ENV"
          echo "AAPT2=$build_tools/aapt2" >> "$GITHUB_ENV"
      - name: Refresh identity for immutable manifest
        id: manifest_identity
        timeout-minutes: 1
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('solana-android-hub-apk-validator');
            core.setSecret(token);
            core.setOutput('token', token);
      - name: Download manifest
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.manifest_identity.outputs.token }}
          HUB_ORIGIN: ${{ inputs.hub_origin }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
        run: |
          set -euo pipefail
          case "$HUB_ORIGIN" in https://*) ;; *) echo "HTTPS Hub origin required" >&2; exit 1;; esac
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$HUB_ORIGIN/api/v1/internal/validator/runs/$CORRELATION_ID/manifest" \
            --output manifest.json
      - name: Validate APK in ephemeral runner storage
        id: validate
        continue-on-error: true
        env:
          VALIDATION_RUN_ID: ${{ inputs.correlation_id }}
        run: node tooling/apk-validator/src/validate.mjs manifest.json result.json
      - name: Return signed result
        if: always()
        timeout-minutes: 2
        uses: actions/github-script@v7
        env:
          HUB_ORIGIN: ${{ inputs.hub_origin }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const origin = new URL(process.env.HUB_ORIGIN);
            if (origin.protocol !== 'https:' || origin.username || origin.password) {
              throw new Error('Credential-free HTTPS Hub origin required');
            }
            let body;
            try {
              body = await fs.readFile('result.json', 'utf8');
            } catch (error) {
              if (error.code !== 'ENOENT') throw error;
              body = JSON.stringify({
                runId: process.env.CORRELATION_ID,
                status: 'failed',
                failureCodes: ['VALIDATOR_RUNNER_FAILED'],
                detail: 'Runner did not produce an APK validation result'
              });
              await fs.writeFile('result.json', body, { mode: 0o600 });
            }
            const endpoint = new URL(`/api/v1/internal/validator/runs/${process.env.CORRELATION_ID}/result`, origin);
            for (let attempt = 1; attempt <= 3; attempt++) {
              // Obtain a fresh JWT for every attempt; preparation may have outlived the initial identity.
              const token = await core.getIDToken('solana-android-hub-apk-validator');
              core.setSecret(token);
              let response;
              try {
                response = await fetch(endpoint, {
                  method: 'POST',
                  headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
                  body,
                  redirect: 'error',
                  signal: AbortSignal.timeout(15_000)
                });
              } catch (error) {
                if (attempt === 3) throw new Error('Validator callback transport failed after 3 attempts');
                core.warning(`Validator callback transport failed (attempt ${attempt})`);
              }
              if (response?.ok) return;
              if (response && (response.status < 500 || attempt === 3)) {
                throw new Error(`Validator callback HTTP ${response.status}`);
              }
              await new Promise((resolve) => setTimeout(resolve, 2_000));
            }
      - name: Enforce validation outcome
        if: always() && steps.validate.outcome != 'success'
        run: exit 1
      - name: Remove transient files
        if: always()
        run: rm -f manifest.json result.json
