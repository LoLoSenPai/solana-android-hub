<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Application artwork placeholder</title>
  <desc id="desc">Four luminous application tiles moving through a blue portal.</desc>
  <defs>
