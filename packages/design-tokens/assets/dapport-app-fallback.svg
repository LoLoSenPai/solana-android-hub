      <stop stop-color="#173E64"/>
      <stop offset="0.62" stop-color="#0B2034"/>
      <stop offset="1" stop-color="#07111D"/>
    </radialGradient>
    <linearGradient id="tileA" x1="260" y1="250" x2="610" y2="720" gradientUnits="userSpaceOnUse">
